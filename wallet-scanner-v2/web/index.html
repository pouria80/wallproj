<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wallet Scanner V2</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>⛓️ Wallet Scanner <span class="v">V2</span></h1>
  <div id="state-badge" class="badge idle">آماده به کار</div>
</header>

<main>
  <!-- controls -->
  <section class="card">
    <h2>کنترل اسکن</h2>
    <div class="btns">
      <button id="btn-start" class="go">▶ شروع اسکن</button>
      <button id="btn-stop" class="stop" disabled>⏹ توقف</button>
      <button id="btn-reset" class="ghost">↺ پاک‌سازی</button>
    </div>
    <details id="settings" open>
      <summary>تنظیمات</summary>
      <div class="grid">
        <label>seed شروع<input id="start-seed" type="number" value="0" min="0"></label>
        <label>seed پایان<input id="end-seed" type="number" value="4294967295" min="0"></label>
        <label>زمان تست (ثانیه، ۰=بدون محدودیت)<input id="duration" type="number" value="60" min="0"></label>
        <label>تعداد ولت بررسی‌شده در هر بازه<input id="batch" type="number" value="50" min="1" max="500"></label>
        <label>فاصله بین بازه‌ها (ثانیه)<input id="interval" type="number" value="1" min="0.1" step="0.1"></label>
        <label>حداقل موجودی برای اعلام (ETH)<input id="threshold" type="number" value="0" min="0" step="0.001"></label>
      </div>
    </details>
  </section>

  <!-- stats -->
  <section class="stats">
    <div class="stat"><b id="st-seeds">0</b><span>seed پیمایش‌شده</span></div>
    <div class="stat"><b id="st-wallets">0</b><span>ولت ساخته‌شده</span></div>
    <div class="stat"><b id="st-checked">0</b><span>موجودی بررسی‌شده</span></div>
    <div class="stat funded"><b id="st-funded">0</b><span>ولت دارای موجودی</span></div>
    <div class="stat"><b id="st-time">0s</b><span>زمان سپری‌شده</span></div>
    <div class="stat"><b id="st-errors">0</b><span>خطا</span></div>
  </section>

  <!-- funded wallets panel -->
  <section class="card hits">
    <h2>💰 ولت‌های دارای موجودی <small>(ذخیره در funded_wallets.txt)</small></h2>
    <div id="no-hits" class="empty">هنوز ولتی با موجودی پیدا نشده است.</div>
    <div id="hits-list"></div>
  </section>

  <!-- log -->
  <section class="card">
    <h2>رویدادها</h2>
    <ul id="log"></ul>
  </section>
</main>

<script src="/app.js"></script>
</body>
</html>
